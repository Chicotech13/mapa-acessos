<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Mapa de Acessos AluGo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Source+Sans+3:wght@400;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="brand"><b>Mapa de Acessos</b><span>AluGo · ERP</span></div>
    <nav class="tabs" role="tablist">
      <a href="#mapa" data-tab="mapa" role="tab">Mapa</a>
      <a href="#permissoes" data-tab="permissoes" role="tab">Permissões</a>
      <a href="#validacao" data-tab="validacao" role="tab">Validação</a>
      <a href="#editar" data-tab="editar" role="tab">Editar</a>
    </nav>
  </div>
</header>

<div class="banner" id="banner" hidden>
  <div class="banner-in">
    <span>Você está vendo uma versão editada, salva só neste navegador.</span>
    <button type="button" class="btn small" data-action="exportar">Exportar arquivo</button>
    <button type="button" class="btn small ghost" data-action="restaurar">Voltar ao original</button>
  </div>
</div>

<main class="wrap">
  <section id="tab-mapa" class="tab" hidden></section>
  <section id="tab-permissoes" class="tab" hidden></section>
  <section id="tab-validacao" class="tab" hidden></section>
  <section id="tab-editar" class="tab" hidden></section>
</main>

<div class="dialog-back" id="confirm" hidden>
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="confirm-title">
    <h3 id="confirm-title">Voltar ao original?</h3>
    <p>As suas edições neste navegador serão apagadas. Exporte antes se quiser guardar.</p>
    <div class="row-btns">
      <button type="button" class="btn ghost" data-action="cancelar">Cancelar</button>
      <button type="button" class="btn danger" data-action="confirmar-restaurar">Apagar edições</button>
    </div>
  </div>
</div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
